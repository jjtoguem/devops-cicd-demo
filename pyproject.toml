[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jjtoguem-calculatrice"
version = "0.1.0"
description = "Une petite calculatrice pour apprendre le DevOps"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Jean Jacques Toguem" }
]

[tool.setuptools.packages.find]
where = ["app"]
